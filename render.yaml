# Render Blueprint: one free web service running the Docker image (API + web app).
# The database is Neon (external, free): paste its connection string when Render asks for DATABASE_URL.
services:
  - type: web
    name: jana-finance
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL # Neon connection string (sslmode=require)
        sync: false
      - key: WEB_ORIGIN # https://<service-name>.onrender.com
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: FIELD_ENCRYPTION_KEY # losing this makes stored Aadhaar/PAN/bank numbers unreadable
        generateValue: true
      - key: BLIND_INDEX_KEY
        generateValue: true
      - key: SEED_SUPERADMIN_EMAIL
        sync: false
      - key: SEED_SUPERADMIN_PASSWORD
        sync: false
      - key: SEED_DEMO # true = load 30 demo customers + 2 chit groups (testing only, never with real data)
        value: "true"
      # Uploaded files: "local" loses them on every restart (fine for a first look). To keep them, create a
      # Cloudflare R2 bucket and add STORAGE_DRIVER=s3, S3_ENDPOINT, S3_BUCKET, S3_ACCESS_KEY, S3_SECRET_KEY
      # in the Render dashboard (see docs/deploy.md).
      - key: STORAGE_DRIVER
        value: local
