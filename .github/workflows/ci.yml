name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jana
          POSTGRES_PASSWORD: jana
          POSTGRES_DB: jana_finance
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jana" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://jana:jana@localhost:5432/jana_finance
      TEST_DATABASE_URL: postgresql://jana:jana@localhost:5432/jana_test
      E2E_ADMIN_DATABASE_URL: postgresql://jana:jana@localhost:5432/postgres
      E2E_CHANNEL: chromium
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @jana/shared build
      - run: pnpm --filter @jana/api prisma:generate
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - name: Dependency audit (production dependencies)
        run: pnpm audit --prod --audit-level high
      - name: End-to-end tests
        run: |
          pnpm --filter @jana/api build
          pnpm --filter @jana/e2e exec playwright install --with-deps chromium
          pnpm --filter @jana/e2e test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
