services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: jana
      POSTGRES_PASSWORD: jana
      POSTGRES_DB: jana_finance
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jana -d jana_finance"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Dev-only mail catcher: http://localhost:8025
  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pgdata:
